[package]
name = "purebred-chat"
version = "3.0.0"
edition = "2021"
description = "Los Purebreds 3.0 - Cloudflare Worker (chat relay + cloud storage) written in Rust"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = "0.8"
serde = { version = "1", features = ["derive"] }
# preserve_order keeps JSON objects in the order the page sent them (the cloud
# storage hands out its "newer than" stamps in that order, like the old JS did)
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
